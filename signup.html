<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NoriPick - 회원가입</title>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>
    <div class="signup-container">
        <header class="signup-header">
            <h1 class="main-title">
                이젠님의<br>
                <span class="highlight">회원 정보</span>를 입력해주세요.
            </h1>
            <p class="sub-title">노리픽에 오신 것을 환영합니다.</p>
        </header>

        <form class="signup-form">
            <div class="form-group">
                <label for="phone">휴대폰 번호</label>
                <div class="input-with-button">
                    <input type="tel" id="phone" placeholder="'-'없이 입력" required>
                    <button type="button" class="btn-verify">인증요청</button>
                </div>
            </div>

            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" placeholder="이름을 입력하세요" required>
            </div>
        </form>

        <div class="bottom-action">
            <button class="btn-next" type="button" onclick="location.href='signup_child.html'">다음</button>
        </div>
    </div>
</body>
</html>
