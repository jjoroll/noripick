<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>nori Pick</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .splash-container {
            width: 430px;
            height: 931px;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }
        .splash-logo { width: 192px; height: auto; }
        .splash-tagline {
            position: absolute;
            bottom: 52px;
            left: 0; right: 0;
            text-align: center;
            font-size: 13px;
            color: #888;
            letter-spacing: -0.2px;
        }
        .splash-tagline .brand { color: #2196F3; }
    </style>
</head>
<body>
    <div class="splash-container" onclick="location.href='onboarding.html'">
        <img class="splash-logo" src="images/logo/blue-horizon.png" alt="nori Pick">
        <p class="splash-tagline">
            서울형 키즈카페 통합검색은, <span class="brand">nori Pick</span>
        </p>
    </div>
    <script>
        // 2초 후 자동으로 온보딩으로 이동
        setTimeout(() => { location.href = 'onboarding.html'; }, 2000);
    </script>
</body>
</html>
