<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NoriPick - QR스캔</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="css/qr-scan.css">
</head>
<body>
    <div class="scan-container">

        <!-- 배경 이미지 (카메라 뷰 + 어두운 오버레이) -->
        <img src="images/qr-scan/QR-scan.png" alt="" class="scan-bg" aria-hidden="true">

        <!-- 닫기 버튼 -->
        <button class="btn-close" aria-label="닫기" onclick="history.back()">
            <img src="images/qr-scan/x-icon.png" alt="닫기">
        </button>

        <!-- 안내 텍스트 -->
        <p class="scan-label">QR코드를 사각 테두리 안에 맞춰주세요</p>

        <!-- 스캔 프레임 -->
        <div class="scan-box">
            <img src="images/qr-scan/div-scnaBox.png" alt="QR 스캔 영역" class="scan-frame">
        </div>

    </div>
</body>
</html>
