<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>nori Pick</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .onboarding-container {
            width: 430px;
            height: 931px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
        }
        .logo-overlay {
            position: absolute;
            top: 175px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="onboarding-container" onclick="location.href='login.html'">
        <img class="bg-img" src="images/onboarding/log-in.gif" alt="nori Pick 온보딩">
        <img class="logo-overlay" src="images/logo/white-vertical.png" alt="nori Pick">
        <button class="skip-btn" onclick="event.stopPropagation(); location.href='login.html'">시작하기</button>
    </div>
</body>
</html>
